<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping Cart</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    header { background: #1f2937; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    #status { font-size: 13px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #999; margin-right: 6px; }
    .ok { background: #22c55e; } .down { background: #ef4444; }
    main { display: flex; gap: 24px; padding: 24px; flex-wrap: wrap; }
    section { flex: 1; min-width: 320px; }
    h2 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .card { background: #fff; border-radius: 8px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .card h3 { margin: 0 0 6px; font-size: 16px; }
    .price { color: #059669; font-weight: bold; }
    .stock { font-size: 12px; color: #666; margin: 4px 0 10px; }
    button { background: #2563eb; color: #fff; border: 0; padding: 7px 12px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button.remove { background: #dc2626; }
    button.checkout { background: #059669; width: 100%; margin-top: 12px; padding: 10px; font-size: 15px; }
    #cart, #orders { background: #fff; border-radius: 8px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    #orders { margin-top: 20px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
    .total { font-size: 18px; font-weight: bold; margin-top: 12px; text-align: right; }
    #msg { margin: 10px 24px 0; font-size: 14px; min-height: 20px; }
  </style>
</head>
<body>
  <header>
    <h1 style="margin:0;font-size:20px;">🛒 Shopping Cart</h1>
    <div id="status"><span class="dot" id="dot"></span><span id="statusText">checking...</span></div>
  </header>
  <div id="msg"></div>

  <main>
    <section>
      <h2>Products</h2>
      <div class="grid" id="products"></div>
    </section>
    <section>
      <h2>Your Cart</h2>
      <div id="cart"></div>
      <h2 style="margin-top:20px;">Past Orders</h2>
      <div id="orders"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function showMsg(text, ok = true) {
      $("msg").style.color = ok ? "#059669" : "#dc2626";
      $("msg").textContent = text;
    }

    async function loadProducts() {
      const res = await fetch("/products");
      const data = await res.json();
      $("products").innerHTML = data.products.map(p => `
        <div class="card">
          <h3>${p.name}</h3>
          <div class="price">₹${p.price}</div>
          <div class="stock">Stock: ${p.stock}</div>
          <button onclick="addToCart(${p.id})">Add to Cart</button>
        </div>`).join("");
    }

    async function loadCart() {
      const res = await fetch("/cart");
      const data = await res.json();
      if (!data.items.length) {
        $("cart").innerHTML = "<p>Cart khali hai</p>";
        return;
      }
      $("cart").innerHTML = data.items.map(i => `
        <div class="row">
          <div><b>${i.name}</b><br><small>₹${i.price} x ${i.quantity} = ₹${i.subtotal}</small></div>
          <button class="remove" onclick="removeFromCart(${i.product_id})">Remove</button>
        </div>`).join("")
        + `<div class="total">Total: ₹${data.total}</div>`
        + `<button class="checkout" onclick="checkout()">Checkout</button>`;
    }

    async function loadOrders() {
      const res = await fetch("/orders");
      const data = await res.json();
      if (!data.orders.length) {
        $("orders").innerHTML = "<p>Abhi koi order nahi hai</p>";
        return;
      }
      $("orders").innerHTML = data.orders.map(o => `
        <div class="row">
          <div><b>Order #${o.order_id}</b><br><small>${o.created_at} | ${o.items_count} item(s)</small></div>
          <div><b>₹${o.total}</b></div>
        </div>`).join("");
    }

    async function addToCart(id) {
      const res = await fetch("/cart/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ product_id: id, quantity: 1 })
      });
      const data = await res.json();
      showMsg(data.message || "Done", data.success !== false);
      loadCart();
    }

    async function removeFromCart(id) {
      const res = await fetch("/cart/remove/" + id, { method: "DELETE" });
      const data = await res.json();
      showMsg(data.message || "Done", data.success !== false);
      loadCart();
    }

    async function checkout() {
      const res = await fetch("/checkout", { method: "POST" });
      const data = await res.json();
      showMsg(
        data.success ? `Order #${data.order_id} place ho gaya (₹${data.total})` : data.message,
        data.success
      );
      loadCart();
      loadOrders();
      loadProducts(); // stock update dikhane ke liye
    }

    async function checkHealth() {
      try {
        const res = await fetch("/health");
        const data = await res.json();
        const up = data.mcp_server === "ok";
        $("dot").className = "dot " + (up ? "ok" : "down");
        $("statusText").textContent = up ? "API + MCP server running" : "MCP server down";
      } catch {
        $("dot").className = "dot down";
        $("statusText").textContent = "API down";
      }
    }

    loadProducts();
    loadCart();
    loadOrders();
    checkHealth();
    setInterval(checkHealth, 10000);
  </script>
</body>
</html>
